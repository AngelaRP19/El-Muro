apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: el-muro-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway # use Istio default gateway implementation
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*" # Allow all domains for now
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: el-muro-routing
  namespace: default
spec:
  hosts:
  - "*"
  gateways:
  - el-muro-gateway
  http:
  # Auth Service Routes
  - match:
    - uri:
        prefix: /api/auth
    route:
    - destination:
        host: auth-service
        port:
          number: 3000
          
  # Posts Service Routes
  - match:
    - uri:
        prefix: /api/posts
    route:
    - destination:
        host: posts-service
        port:
          number: 8002

  # Subjects Service Routes
  - match:
    - uri:
        prefix: /api/subjects
    route:
    - destination:
        host: subjects-service
        port:
          number: 8004

  # Topics Service Routes
  - match:
    - uri:
        prefix: /api/v1/topics
    route:
    - destination:
        host: topics-service
        port:
          number: 8000

  # Careers Service Routes
  - match:
    - uri:
        prefix: /api/carreras
    route:
    - destination:
        host: career-service
        port:
          number: 8001

  # Frontend Routes (React SPA)
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: frontend-service
        port:
          number: 80
