---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topics-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: topics-db
  template:
    metadata:
      labels:
        app: topics-db
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "topics_db"
        - name: POSTGRES_USER
          value: "topics_user"
        - name: POSTGRES_PASSWORD
          value: "topics_password"
---
apiVersion: v1
kind: Service
metadata:
  name: topics-db
spec:
  selector:
    app: topics-db
  ports:
  - port: 5432
