apiVersion: apps/v1
kind: Deployment
metadata:
  name: career-service
  labels:
    app: career-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: career-service
      version: v1
  template:
    metadata:
      labels:
        app: career-service
        version: v1
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: career-service
          image: career-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: career-service-config
            - secretRef:
                name: career-service-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20

