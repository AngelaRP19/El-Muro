# NOTE: This file should NOT be committed to git repository with actual credentials
# Secrets must be managed via:
# - External Secret Management System (e.g., Sealed Secrets, Vault)
# - CI/CD pipeline secrets
# - Manual kubectl apply with actual credentials
#
# Template for reference:
apiVersion: v1
kind: Secret
metadata:
  name: career-service-secret
  labels:
    app: career-service
type: Opaque
stringData:
  # Replace with actual database URL - NEVER commit real credentials
  DATABASE_URL: "REPLACE_WITH_ACTUAL_DATABASE_URL"
  # Replace with actual JWT secret - NEVER commit real secrets
  JWT_SECRET: "REPLACE_WITH_ACTUAL_JWT_SECRET"

