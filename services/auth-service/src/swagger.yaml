openapi: 3.0.0
info:
  title: Auth Service API
  description: Microservicio de autenticación y gestión de usuarios
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local server
paths:
  /api/auth/login:
    post:
      summary: Iniciar sesión
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correo:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          description: Error en credenciales
  /api/auth/register:
    post:
      summary: Registrar usuario
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                correo:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Creado exitosamente
  /api/auth/me:
    get:
      summary: Obtener perfil
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: No autorizado
  /api/auth/me/puntos:
    get:
      summary: Obtener puntos
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: No autorizado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
