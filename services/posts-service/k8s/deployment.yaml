apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-service
  labels:
    app: posts-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: posts-service
  template:
    metadata:
      labels:
        app: posts-service
        version: v1
    spec:
      containers:
        - name: posts-service
          image: posts-service:latest
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: MONGO_URI
              value: "mongodb://admin:password@mongo-posts:27017/posts_service?authSource=admin"
            - name: REDIS_HOST
              value: "redis-posts"
            - name: REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              value: "juangpt1234"
            - name: AUTH_SERVICE_NAME
              value: "auth-service"
            - name: TOPIC_SERVICE_NAME
              value: "temas-service"
            - name: EUREKA_DEFAULT_ZONE
              value: "http://eureka:8761/eureka/"